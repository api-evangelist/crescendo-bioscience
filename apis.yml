description: 'Crescendo Bioscience was a molecular-diagnostics company based in South San Francisco,
  known for Vectra DA (later Vectra), a multi-biomarker blood test that measures disease activity in
  rheumatoid arthritis. Backed by Kleiner Perkins and other venture investors, it was acquired by Myriad
  Genetics in 2014 and its diagnostic product now sits within Myriad. It has no independent public
  developer surface: no API, developer portal, documentation, or SDKs, and its former domains no longer
  resolve. Retained in the API Evangelist network as a VC-portfolio lead; no API artifacts apply.'
